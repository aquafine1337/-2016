<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>#aquafine</title>
<meta name="theme-color" content="#a050ff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Плеер">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23a050ff'/><path d='M35 28 L35 64' stroke='white' stroke-width='7' stroke-linecap='round'/><path d='M35 40 Q55 30 65 48 Q55 44 35 54' stroke='none' fill='white'/><circle cx='27' cy='67' r='9' fill='white'/><circle cx='57' cy='59' r='9' fill='white'/></svg>">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --accent: #a050ff;
  --accent-light: #bf6fff;
  --accent-r: 160; --accent-g: 80; --accent-b: 255;
  --card-w: min(430px, 94vw);
  --card-bg: rgba(14,10,22,0.93);
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { width:100%; height:100%; overflow:hidden; }
body {
  background:#000;
  display:flex; align-items:center; justify-content:center;
  font-family:'Inter',sans-serif;
  perspective:1200px;
  min-height:100dvh;
}
canvas#bg { position:fixed; inset:0; width:100%; height:100%; z-index:0; }
#bg-overlay { position:fixed; inset:0; z-index:1; pointer-events:none; transition:background 2s; }
#lightning  { position:fixed; inset:0; z-index:2; pointer-events:none; }

/* ── CARD ── */
.scene { position:relative; z-index:10; transform-style:preserve-3d; }
.card {
  background: var(--card-bg);
  border: 1px solid rgba(var(--accent-r),var(--accent-g),var(--accent-b),.22);
  border-radius: clamp(14px,2vw,22px);
  width: var(--card-w);
  overflow: hidden;
  backdrop-filter: blur(28px);
  box-shadow: 0 32px 80px rgba(0,0,0,.75), inset 0 0 0 .5px rgba(255,255,255,.04);
  transform-style: preserve-3d;
}

/* ── BANNER ── */
.banner {
  position:relative; width:100%;
  height: clamp(110px,22vw,155px);
  overflow:hidden; cursor:pointer;
  background: linear-gradient(135deg,#1a0a2e,#2d0b4e,#06060f);
}
.banner-img-el { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:none; }
.banner-edit-btn {
  position:absolute; top:10px; right:10px;
  width:32px; height:32px; border-radius:10px;
  background:rgba(0,0,0,.55); border:1px solid rgba(255,255,255,.18);
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; transition:all .2s; backdrop-filter:blur(8px);
  color:rgba(255,255,255,.8);
}
.banner-edit-btn:hover { background:rgba(var(--accent-r),var(--accent-g),var(--accent-b),.35); border-color:var(--accent); }
.banner-placeholder {
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
}
/* decorative gradient blobs in banner */
.blob {
  position:absolute; border-radius:50%; filter:blur(40px); opacity:.35; pointer-events:none;
}
.blob1 { width:160px; height:160px; background:var(--accent); top:-40px; left:-20px; }
.blob2 { width:120px; height:120px; background:#ff5080; top:20px; right:10px; opacity:.2; }

/* ── AVATAR ── */
.avatar-row {
  display:flex; justify-content:center;
  margin-top: calc(clamp(30px,6vw,42px) * -1);
  margin-bottom: clamp(8px,1.5vw,12px);
  position:relative; z-index:5;
}
.avatar-wrap {
  position:relative;
  width: clamp(56px,12vw,68px);
  height: clamp(56px,12vw,68px);
}
.avatar-img {
  width:100%; height:100%; border-radius:50%;
  border:3px solid var(--accent);
  object-fit:cover; background:#1a0a2e;
  display:flex; align-items:center; justify-content:center;
  overflow:hidden; transition:border-color .3s;
}
.avatar-edit {
  position:absolute; bottom:-2px; right:-2px;
  width:22px; height:22px; border-radius:50%;
  background: var(--accent);
  border:2px solid var(--card-bg);
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; transition:transform .2s;
}
.avatar-edit:hover { transform:scale(1.15); }

/* ── TRACK INFO ── */
.username {
  font-family:'Unbounded',sans-serif;
  font-size: clamp(12px,3vw,15px);
  font-weight:600; color:#fff;
  text-align:center; letter-spacing:.04em;
  margin-bottom: clamp(10px,2vw,14px);
}
.cover-area { display:flex; justify-content:center; margin-bottom: clamp(10px,2vw,14px); }
.cover-img {
  width: clamp(72px,16vw,92px);
  height: clamp(72px,16vw,92px);
  border-radius:14px; object-fit:cover;
  border:2px solid rgba(var(--accent-r),var(--accent-g),var(--accent-b),.38);
  background:#1a0a2e; transition:border-color .3s;
  box-shadow: 0 8px 28px rgba(var(--accent-r),var(--accent-g),var(--accent-b),.18);
}
.cover-img.playing { animation:spin 12s linear infinite; border-radius:50%; }
@keyframes spin { to { transform:rotate(360deg) } }

.track-info {
  text-align:center; padding:0 clamp(16px,4vw,26px);
  margin-bottom: clamp(12px,2.5vw,18px); min-height:38px;
}
.track-title {
  font-family:'Unbounded',sans-serif;
  font-size: clamp(10px,2.5vw,13px);
  color:#e0d0ff; letter-spacing:.02em;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.track-artist { font-size: clamp(10px,2.2vw,12px); color:rgba(200,170,255,.5); margin-top:3px; }

/* ── PROGRESS ── */
.progress-wrap { padding:0 clamp(16px,4vw,26px); margin-bottom:5px; }
.pbar-bg {
  width:100%; height:4px; background:rgba(255,255,255,.07);
  border-radius:2px; cursor:pointer; position:relative; overflow:visible;
}
.pbar-fill {
  height:100%; width:0%; border-radius:2px;
  background:linear-gradient(90deg,var(--accent),var(--accent-light));
  transition:width .5s linear; position:relative;
}
.pbar-fill::after {
  content:''; position:absolute; right:-6px; top:-5px;
  width:14px; height:14px; background:var(--accent-light);
  border-radius:50%; box-shadow:0 0 10px rgba(var(--accent-r),var(--accent-g),var(--accent-b),.6);
}
.times {
  display:flex; justify-content:space-between;
  padding:5px clamp(16px,4vw,26px) 0;
  font-size:10px; color:rgba(200,170,255,.4);
  margin-bottom: clamp(12px,2.5vw,18px);
}

/* ── CONTROLS ── */
.controls {
  display:flex; align-items:center; justify-content:center;
  gap: clamp(14px,4vw,22px);
  margin-bottom: clamp(12px,2.5vw,18px);
}
.btn {
  background:none; border:none; cursor:pointer;
  border-radius:50%; display:flex; align-items:center; justify-content:center;
  transition:background .2s, transform .15s; color:rgba(200,170,255,.65);
  padding: clamp(6px,1.5vw,9px);
}
.btn:hover { background:rgba(var(--accent-r),var(--accent-g),var(--accent-b),.12); color:var(--accent-light); transform:scale(1.1); }
.btn svg { width:clamp(16px,4vw,21px); height:clamp(16px,4vw,21px); }
.btn-play {
  width: clamp(44px,10vw,54px);
  height: clamp(44px,10vw,54px);
  background:rgba(var(--accent-r),var(--accent-g),var(--accent-b),.15);
  border:1.5px solid rgba(var(--accent-r),var(--accent-g),var(--accent-b),.45)!important;
  color:var(--accent-light);
}
.btn-play:hover { background:rgba(var(--accent-r),var(--accent-g),var(--accent-b),.28); }
.btn-play svg { width:clamp(18px,4.5vw,24px); height:clamp(18px,4.5vw,24px); }

/* ── VOLUME ── */
.volume-row {
  display:flex; align-items:center; gap:10px;
  padding:0 clamp(16px,4vw,26px);
  margin-bottom: clamp(14px,2.5vw,20px);
}
.volume-row svg { flex-shrink:0; color:rgba(200,170,255,.45); width:15px; height:15px; }
input[type=range] {
  -webkit-appearance:none; flex:1; height:3px;
  background:rgba(255,255,255,.1); border-radius:2px; outline:none; cursor:pointer;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance:none; width:13px; height:13px;
  border-radius:50%; background:var(--accent); cursor:pointer;
  box-shadow:0 0 6px rgba(var(--accent-r),var(--accent-g),var(--accent-b),.5);
}
.vol-val { font-size:10px; color:rgba(200,170,255,.38); min-width:24px; text-align:right; }

/* ── SETTINGS TOGGLE ── */
.settings-row { display:flex; justify-content:center; padding-bottom:6px; }
.settings-pill {
  display:flex; align-items:center; gap:6px;
  background:rgba(var(--accent-r),var(--accent-g),var(--accent-b),.07);
  border:1px solid rgba(var(--accent-r),var(--accent-g),var(--accent-b),.18);
  border-radius:20px; padding:5px 16px;
  color:rgba(200,170,255,.5); font-size:10px;
  font-family:'Inter',sans-serif; cursor:pointer;
  transition:all .2s; letter-spacing:.05em;
}
.settings-pill:hover { background:rgba(var(--accent-r),var(--accent-g),var(--accent-b),.15); color:rgba(200,170,255,.9); border-color:rgba(var(--accent-r),var(--accent-g),var(--accent-b),.4); }

/* ── SETTINGS PANEL ── */
.settings-panel {
  display:none; overflow-y:auto; max-height:55vh;
  padding:14px clamp(14px,3.5vw,22px) 10px;
  border-top:1px solid rgba(var(--accent-r),var(--accent-g),var(--accent-b),.1);
  scrollbar-width:none;
}
.settings-panel::-webkit-scrollbar { display:none; }
.settings-panel.open { display:block; }

.s-section {
  font-size:9px; font-weight:700; letter-spacing:.12em; text-transform:uppercase;
  color:rgba(var(--accent-r),var(--accent-g),var(--accent-b),.55);
  margin:12px 0 8px; padding-bottom:5px;
  border-bottom:1px solid rgba(var(--accent-r),var(--accent-g),var(--accent-b),.08);
  display:flex; align-items:center; gap:6px;
}
.s-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:11px; }
.s-label { font-size:11px; color:rgba(200,170,255,.55); }
.presets { display:flex; gap:7px; align-items:center; flex-wrap:wrap; }

/* Color dots */
.cdot {
  width:21px; height:21px; border-radius:50%; cursor:pointer;
  border:2px solid transparent; transition:transform .15s, border-color .15s; flex-shrink:0;
}
.cdot:hover { transform:scale(1.2); }
.cdot.on { border-color:#fff; box-shadow:0 0 8px rgba(255,255,255,.3); }
input[type=color] { cursor:pointer; border:none; padding:0; background:none; }

/* Swatches */
.swatch {
  width:26px; height:20px; border-radius:5px; cursor:pointer;
  border:2px solid transparent; transition:transform .15s, border-color .15s;
}
.swatch:hover { transform:scale(1.1); }
.swatch.on { border-color:#fff; }

/* Weather grid */
.wx-grid {
  display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-bottom:12px;
}
.wx-btn {
  background:rgba(255,255,255,.03);
  border:1px solid rgba(var(--accent-r),var(--accent-g),var(--accent-b),.14);
  border-radius:10px; padding:7px 3px 6px;
  cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:4px;
  transition:all .2s; color:rgba(200,170,255,.55); font-size:9px;
  font-family:'Inter',sans-serif; letter-spacing:.02em;
}
.wx-btn:hover { background:rgba(var(--accent-r),var(--accent-g),var(--accent-b),.12); border-color:rgba(var(--accent-r),var(--accent-g),var(--accent-b),.4); color:#e0d0ff; }
.wx-btn.on { background:rgba(var(--accent-r),var(--accent-g),var(--accent-b),.22); border-color:var(--accent); color:#fff; }
.wx-icon { display:block; line-height:1; }

/* Size & tilt buttons */
.sz-btns,.small-btns { display:flex; gap:5px; }
.sz-btn,.s-btn {
  background:rgba(255,255,255,.04);
  border:1px solid rgba(var(--accent-r),var(--accent-g),var(--accent-b),.14);
  border-radius:7px; padding:4px 11px; font-size:10px;
  font-family:'Inter',sans-serif; color:rgba(200,170,255,.55); cursor:pointer; transition:all .2s;
}
.sz-btn:hover,.s-btn:hover { background:rgba(var(--accent-r),var(--accent-g),var(--accent-b),.1); color:#e0d0ff; }
.sz-btn.on,.s-btn.on { background:rgba(var(--accent-r),var(--accent-g),var(--accent-b),.22); border-color:var(--accent); color:#fff; }

/* Slider rows */
.sl-row { display:flex; align-items:center; gap:8px; }
.sl-row input[type=range] { width:85px; flex:none; }
.sl-v { font-size:10px; color:rgba(200,170,255,.4); min-width:20px; }

/* Upload buttons */
.up-btn {
  display:flex; align-items:center; gap:6px;
  background:rgba(var(--accent-r),var(--accent-g),var(--accent-b),.08);
  border:1px solid rgba(var(--accent-r),var(--accent-g),var(--accent-b),.22);
  border-radius:8px; padding:5px 12px;
  color:rgba(200,170,255,.65); font-size:10px;
  font-family:'Inter',sans-serif; cursor:pointer; transition:all .2s;
}
.up-btn:hover { background:rgba(var(--accent-r),var(--accent-g),var(--accent-b),.18); color:#fff; }

.loading { text-align:center; font-size:11px; color:rgba(200,170,255,.35); padding:4px 0 0; }

#sc-widget { display:none; }

/* ── MOBILE ── */
@media (max-width:480px) {
  .wx-grid { grid-template-columns:repeat(4,1fr); gap:5px; }
  .wx-btn { font-size:8px; padding:6px 2px 5px; border-radius:8px; }
  .settings-panel { max-height:50vh; }
}

/* ── INTRO SCREEN ── */
#intro {
  position:fixed; inset:0; z-index:1000;
  background:#000;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  gap:0;
  transition: opacity .8s ease;
}
#intro.hide { opacity:0; pointer-events:none; }

#intro canvas {
  position:absolute; inset:0; width:100%; height:100%;
}

.intro-content {
  position:relative; z-index:2;
  display:flex; flex-direction:column;
  align-items:center; gap:clamp(18px,4vw,32px);
}

.skulls-row {
  display:flex; gap:clamp(20px,6vw,50px);
  align-items:flex-end;
}

.skull-svg {
  filter: drop-shadow(0 0 18px rgba(255,255,255,.5));
  animation: skullFloat 3s ease-in-out infinite;
}
.skull-svg:nth-child(2) { animation-delay:-.8s; transform:scale(.75); }

@keyframes skullFloat {
  0%,100%{ transform:translateY(0); }
  50%{ transform:translateY(-10px); }
}
.skull-svg:nth-child(2) {
  animation-name: skullFloat2;
}
@keyframes skullFloat2 {
  0%,100%{ transform:translateY(0) scale(.75); }
  50%{ transform:translateY(-10px) scale(.75); }
}

.intro-tag {
  font-family:'Unbounded',sans-serif;
  font-size: clamp(22px,6vw,42px);
  font-weight:600; color:#fff;
  letter-spacing:.08em;
  text-shadow: 0 0 30px rgba(255,255,255,.4), 0 0 60px rgba(160,80,255,.3);
  animation: glitchText 4s infinite;
}

@keyframes glitchText {
  0%,90%,100%{ clip-path:none; transform:none; }
  91%{ clip-path:inset(20% 0 60% 0); transform:translateX(-4px); }
  92%{ clip-path:inset(60% 0 10% 0); transform:translateX(4px); }
  93%{ clip-path:none; transform:none; }
  96%{ clip-path:inset(40% 0 40% 0); transform:translateX(-2px); }
  97%{ clip-path:none; }
}

.intro-sub {
  font-family:'Inter',sans-serif;
  font-size: clamp(10px,2.5vw,13px);
  color:rgba(255,255,255,.3);
  letter-spacing:.2em;
  text-transform:uppercase;
}

.enter-btn {
  background:none;
  border:none;
  cursor:pointer;
  margin-top:clamp(8px,2vw,16px);
  display:flex; flex-direction:column; align-items:center; gap:10px;
  transition:transform .2s;
  -webkit-tap-highlight-color:transparent;
}
.enter-btn:hover { transform:scale(1.08); }
.enter-btn:hover .enter-skull { filter:drop-shadow(0 0 28px rgba(160,80,255,.9)); }

.enter-skull {
  filter:drop-shadow(0 0 14px rgba(160,80,255,.6));
  transition:filter .3s;
  animation:enterPulse 2s ease-in-out infinite;
}
@keyframes enterPulse {
  0%,100%{ filter:drop-shadow(0 0 10px rgba(160,80,255,.5)); }
  50%{ filter:drop-shadow(0 0 26px rgba(160,80,255,.9)); }
}

.enter-label {
  font-family:'Inter',sans-serif;
  font-size:11px; color:rgba(200,170,255,.6);
  letter-spacing:.18em; text-transform:uppercase;
}

/* glitch scan lines on intro */
#intro::after {
  content:''; position:absolute; inset:0;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.08) 2px,rgba(0,0,0,.08) 4px);
  pointer-events:none; z-index:1;
}
</style>
</head>
<body>

<!-- INTRO SCREEN -->
<div id="intro">
 <canvas id="intro-bg"></canvas>
 <div class="intro-content">
  <div class="intro-tag">#aquafine</div>
  <div class="intro-sub">нажми чтобы войти</div>

  <button class="enter-btn" id="enter-btn">
   <svg class="enter-skull" width="60" height="60" viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
    <circle cx="30" cy="30" r="28" fill="rgba(160,80,255,0.15)" stroke="rgba(160,80,255,0.6)" stroke-width="1.5"/>
    <polygon points="22,16 22,44 46,30" fill="#a050ff"/>
   </svg>
   <span class="enter-label">войти</span>
  </button>
 </div>
</div>

<canvas id="bg"></canvas>
<div id="bg-overlay"></div>
<div id="lightning"></div>

<input type="file" id="up-banner" accept="image/*" style="display:none">
<input type="file" id="up-avatar" accept="image/*" style="display:none">

<div class="scene" id="scene">
 <div class="card" id="card">

  <!-- BANNER -->
  <div class="banner" id="banner">
   <div class="blob blob1" id="blob1"></div>
   <div class="blob blob2"></div>
   <img class="banner-img-el" id="banner-img" src="" alt="">
   <div class="banner-placeholder" id="banner-ph">
    <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.15)" stroke-width="1"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
   </div>
   <div class="banner-edit-btn" onclick="document.getElementById('up-banner').click()" title="Изменить баннер">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>
   </div>
  </div>

  <!-- AVATAR (поднят выше, поверх баннера) -->
  <div class="avatar-row">
   <div class="avatar-wrap">
    <div class="avatar-img" id="avatar-img">
     <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="rgba(160,80,255,.5)" stroke-width="1.5"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
    </div>
    <div class="avatar-edit" onclick="document.getElementById('up-avatar').click()" title="Изменить аватар">
     <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>
    </div>
   </div>
  </div>

  <div class="username">#aquafine</div>

  <!-- COVER -->
  <div class="cover-area">
   <img class="cover-img" id="cover" src="" alt="" style="background:linear-gradient(135deg,#2d0b4e,#06060f)"/>
  </div>

  <div class="track-info">
   <div class="track-title" id="title">Загрузка...</div>
   <div class="track-artist" id="artist"></div>
  </div>

  <!-- PROGRESS -->
  <div class="progress-wrap">
   <div class="pbar-bg" id="pbar-bg"><div class="pbar-fill" id="pbar-fill"></div></div>
  </div>
  <div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div>

  <!-- CONTROLS -->
  <div class="controls">
   <button class="btn" id="btn-prev">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/></svg>
   </button>

<script>
// ── CANVAS ──────────────────────────────────────────────────
const cv  = document.getElementById('bg');
const ctx = cv.getContext('2d');
let W,H, wx='digits', fR=160,fG=80,fB=255, intensV=5, spdV=5, parts=[];

function h2r(hex){ return {r:parseInt(hex.slice(1,3),16),g:parseInt(hex.slice(3,5),16),b:parseInt(hex.slice(5,7),16)}; }

function rsz(){ W=cv.width=innerWidth; H=cv.height=innerHeight; init(); }
rsz(); addEventListener('resize', rsz);

function init(){
  parts=[];
  if(wx==='digits'||wx==='waterfall'){
    const sp=14, n=Math.floor(W/sp);
    for(let i=0;i<n;i++) parts.push({x:i*sp,y:Math.random()*-H,spd:(Math.random()*1.5+.5)*(spdV/5),a:Math.random()*.5+.15,len:~~(Math.random()*22+8)});
  } else if(wx==='rain'||wx==='storm'){
    const n=~~(500*(intensV/5)*(wx==='storm'?1.4:1));
    for(let i=0;i<n;i++) parts.push({x:Math.random()*W,y:Math.random()*H,vy:(Math.random()*8+6)*(spdV/5),vx:-1.5,len:~~(Math.random()*18+8),a:Math.random()*.4+.15});
  } else if(wx==='wind'){
    const n=~~(120*(intensV/5));
    for(let i=0;i<n;i++) parts.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()*6+4)*(spdV/5),vy:(Math.random()-.5)*1.5,len:~~(Math.random()*60+20),a:Math.random()*.3+.1});
  } else if(wx==='snow'){
    const n=~~(200*(intensV/5));
    for(let i=0;i<n;i++) parts.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*3+1,vy:(Math.random()*1.5+.5)*(spdV/5),vx:(Math.random()-.5)*.8,wb:Math.random()*Math.PI*2,wbs:Math.random()*.02+.005,a:Math.random()*.6+.2});
  } else if(wx==='fog'){
    const n=~~(40*(intensV/5));
    for(let i=0;i<n;i++) parts.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*220+80,vx:(Math.random()-.5)*.3*(spdV/5),a:Math.random()*.07+.02});
  } else if(wx==='stars'){
    const n=~~(300*(intensV/5));
    for(let i=0;i<n;i++) parts.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.6+.3,tw:Math.random()*Math.PI*2,tws:Math.random()*.03+.005,ba:Math.random()*.6+.2});
  }
}

const CHARS='0123456789';
let ltTimer=0;
const ltEl=document.getElementById('lightning');

function lt(){
  ltEl.style.background=`rgba(200,220,255,${Math.random()*.18+.08})`;
  setTimeout(()=>ltEl.style.background='',80);
  setTimeout(()=>{ ltEl.style.background=`rgba(200,220,255,${Math.random()*.1+.05})`; setTimeout(()=>ltEl.style.background='',55); },130);
}

function frame(){
  if(wx==='digits'||wx==='waterfall'){
    ctx.fillStyle='rgba(0,0,0,.05)'; ctx.fillRect(0,0,W,H);
    ctx.font='14px monospace';
    for(let p of parts){
      for(let j=0;j<p.len;j++){
        const y=p.y-j*14; if(y<-14||y>H+14) continue;
        const fade=1-j/p.len;
        const a = j===0 ? Math.min(p.a*1.5,1) : fade*p.a*.8;
        ctx.fillStyle = j===0 ? `rgba(220,200,255,${a})` : `rgba(${fR},${fG},${fB},${a})`;
        ctx.fillText(CHARS[~~(Math.random()*10)],p.x,y);
      }
      p.y+=p.spd*(spdV/5);
      if(p.y-p.len*14>H){ p.y=Math.random()*-100-50; p.spd=(Math.random()*1.5+.5)*(spdV/5); p.a=Math.random()*.5+.15; p.len=~~(Math.random()*22+8); }
    }
    if(wx==='waterfall'){
      const g=ctx.createLinearGradient(0,H*.65,0,H);
      g.addColorStop(0,`rgba(${fR},${fG},${fB},0)`); g.addColorStop(1,`rgba(${fR},${fG},${fB},.05)`);
      ctx.fillStyle=g; ctx.fillRect(0,H*.65,W,H*.35);
    }
  } else if(wx==='rain'||wx==='storm'){
    ctx.fillStyle='rgba(0,0,0,.05)'; ctx.fillRect(0,0,W,H);
    ctx.strokeStyle=`rgba(${fR},${fG},${fB},.32)`; ctx.lineWidth=wx==='storm'?1.2:.8;
    for(let p of parts){
      ctx.globalAlpha=p.a; ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(p.x+p.vx*(p.len/8),p.y+p.len); ctx.stroke();
      ctx.globalAlpha=1; p.x+=p.vx*(spdV/5); p.y+=p.vy*(spdV/5);
      if(p.y>H){ p.y=-p.len; p.x=Math.random()*W; }
    }
    if(wx==='storm'){ ltTimer++; if(ltTimer>~~(60*(6-spdV*.5))&&Math.random()<.025){ lt(); ltTimer=0; } }
  } else if(wx==='wind'){
    ctx.fillStyle='rgba(0,0,0,.04)'; ctx.fillRect(0,0,W,H);
    for(let p of parts){
      ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(p.x-p.len,p.y-p.vy*5);
      ctx.strokeStyle=`rgba(${fR},${fG},${fB},${p.a})`; ctx.lineWidth=.8; ctx.stroke();
      p.x+=p.vx*(spdV/5); p.y+=p.vy;
      if(p.x>W+p.len){ p.x=-p.len; p.y=Math.random()*H; }
    }
  } else if(wx==='snow'){
    ctx.fillStyle='rgba(0,0,0,.04)'; ctx.fillRect(0,0,W,H);
    for(let p of parts){
      p.wb+=p.wbs*(spdV/5); p.x+=Math.sin(p.wb)*.6+p.vx; p.y+=p.vy*(spdV/5);
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fillStyle=`rgba(${fR},${fG},${fB},${p.a})`; ctx.fill();
      if(p.y>H+10) p.y=-10; if(p.x>W+10) p.x=-10; if(p.x<-10) p.x=W+10;
    }
  } else if(wx==='fog'){
    ctx.clearRect(0,0,W,H);
    for(let p of parts){
      const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r);
      g.addColorStop(0,`rgba(${fR},${fG},${fB},${p.a})`); g.addColorStop(1,`rgba(${fR},${fG},${fB},0)`);
      ctx.fillStyle=g; ctx.fillRect(p.x-p.r,p.y-p.r,p.r*2,p.r*2);
      p.x+=p.vx; if(p.x>W+p.r) p.x=-p.r; if(p.x<-p.r) p.x=W+p.r;
    }
  } else if(wx==='stars'){
    ctx.fillStyle='rgba(0,0,0,.12)'; ctx.fillRect(0,0,W,H);
    for(let p of parts){
      p.tw+=p.tws*(spdV/5);
      const a=p.ba*(.5+.5*Math.sin(p.tw));
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fillStyle=`rgba(${fR},${fG},${fB},${a})`; ctx.fill();
    }
  }
  requestAnimationFrame(frame);
}
frame();

// ── SOUNDCLOUD ───────────────────────────────────────────────
const statusEl=document.getElementById('status');
const volRange=document.getElementById('vol-range');
const volVal=document.getElementById('vol-val');
function fmt(ms){ const s=~~(ms/1000); return ~~(s/60)+':'+String(s%60).padStart(2,'0'); }

let widget = null;
const DEFAULT_PL = 'https://soundcloud.com/1707213/sets/na-podumat';

function updateTrackInfo(w){
  w.getCurrentSound(s=>{
    if(!s) return;
    document.getElementById('title').textContent = s.title||'';
    document.getElementById('artist').textContent = s.user?.username||'';
    document.getElementById('cover').src = s.artwork_url?.replace('-large','-t300x300')||s.user?.avatar_url||'';
  });
}

function bindWidget(w){
  w.bind(SC.Widget.Events.READY,()=>{
    statusEl.textContent='';
    w.setVolume(+volRange.value||80);
    updateTrackInfo(w);
  });
  w.bind(SC.Widget.Events.PLAY,()=>{
    document.getElementById('ico-play').style.display='none';
    document.getElementById('ico-pause').style.display='';
    document.getElementById('cover').classList.add('playing');
    updateTrackInfo(w);
  });
  w.bind(SC.Widget.Events.PAUSE,()=>{
    document.getElementById('ico-play').style.display='';
    document.getElementById('ico-pause').style.display='none';
    document.getElementById('cover').classList.remove('playing');
  });
  w.bind(SC.Widget.Events.PLAY_PROGRESS,d=>{
    document.getElementById('cur').textContent=fmt(d.currentPosition);
    w.getDuration(dur=>{ if(dur>0){ document.getElementById('dur').textContent=fmt(dur); document.getElementById('pbar-fill').style.width=(d.currentPosition/dur*100)+'%'; } });
  });
  w.bind(SC.Widget.Events.FINISH,()=>w.next());
}

function loadPlaylist(url, onDone){
  const iframe = document.getElementById('sc-widget');
  const src = `https://w.soundcloud.com/player/?url=${encodeURIComponent(url)}&auto_play=false&hide_related=true&show_comments=false&show_user=false&show_reposts=false&show_teaser=false&visual=false`;
  iframe.src = src;
  iframe.onload = ()=>{
    widget = SC.Widget(iframe);
    bindWidget(widget);
    if(onDone) setTimeout(onDone, 800);
  };
}

// ── MUSIC NOTES RAIN ─────────────────────────────────────────
function makeSkullRain(){
  parts=[];
  const n=~~(60*(intensV/5));
  for(let i=0;i<n;i++) parts.push({
    x:Math.random()*W, y:Math.random()*H,
    vy:(Math.random()*2+1)*(spdV/5),
    vx:(Math.random()-.5)*.5,
    size:Math.random()*20+10,
    rot:Math.random()*Math.PI*2,
    rotV:(Math.random()-.5)*.04,
    a:Math.random()*.6+.2,
    type:~~(Math.random()*3)
  });
}

function drawSkulls(){
  ctx.fillStyle='rgba(0,0,0,.05)'; ctx.fillRect(0,0,W,H);
  for(let p of parts){
    ctx.save();
    ctx.translate(p.x,p.y);
    ctx.rotate(p.rot);
    ctx.globalAlpha=p.a;
    ctx.fillStyle=`rgb(${fR},${fG},${fB})`;
    ctx.strokeStyle=`rgb(${fR},${fG},${fB})`;
    const s=p.size/24;
    ctx.scale(s,s);
    if(p.type===0){
      // Quarter note ♩
      ctx.beginPath(); ctx.ellipse(0,0,9,7,Math.PI*0.2,0,Math.PI*2); ctx.fill();
      ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(8,-3); ctx.lineTo(8,-28); ctx.stroke();
    } else if(p.type===1){
      // Eighth note ♪
      ctx.beginPath(); ctx.ellipse(0,0,9,7,Math.PI*0.2,0,Math.PI*2); ctx.fill();
      ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(8,-3); ctx.lineTo(8,-28); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(8,-28); ctx.quadraticCurveTo(22,-22,18,-14); ctx.stroke();
    } else {
      // Double note ♫
      ctx.beginPath(); ctx.ellipse(-10,0,7,5,Math.PI*0.2,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(8,-4,7,5,Math.PI*0.2,0,Math.PI*2); ctx.fill();
      ctx.lineWidth=2.5;
      ctx.beginPath(); ctx.moveTo(-4,-3); ctx.lineTo(-4,-22); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(14,-7); ctx.lineTo(14,-26); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-4,-22); ctx.lineTo(14,-26); ctx.stroke();
    }
    ctx.globalAlpha=1; ctx.restore();
    p.x+=p.vx; p.y+=p.vy*(spdV/5); p.rot+=p.rotV;
    if(p.y>H+40){ p.y=-40; p.x=Math.random()*W; }
  }
}

// ── INTRO SCREEN ─────────────────────────────────────────────
const introBg = document.getElementById('intro-bg');
const ictx = introBg.getContext('2d');
let iW, iH, iDots=[];

function introResize(){ iW=introBg.width=innerWidth; iH=introBg.height=innerHeight; initIntroDots(); }
introResize(); addEventListener('resize', introResize);

function initIntroDots(){
  iDots=[];
  const sp=36, cols=~~(iW/sp), rows=~~(iH/sp);
  for(let i=0;i<=cols;i++) for(let j=0;j<=rows;j++)
    iDots.push({x:i*sp,y:j*sp,ox:i*sp,oy:j*sp,vx:(Math.random()-.5)*.25,vy:(Math.random()-.5)*.25,r:Math.random()*.9+.3,a:Math.random()*.25+.05});
}

function animIntro(){
  if(!document.getElementById('intro').classList.contains('hide')){
    ictx.clearRect(0,0,iW,iH);
    for(let d of iDots){
      d.x+=d.vx; d.y+=d.vy;
      if(Math.abs(d.x-d.ox)>14) d.vx*=-1;
      if(Math.abs(d.y-d.oy)>14) d.vy*=-1;
      ictx.beginPath(); ictx.arc(d.x,d.y,d.r,0,Math.PI*2);
      ictx.fillStyle=`rgba(160,80,255,${d.a})`; ictx.fill();
    }
    requestAnimationFrame(animIntro);
  }
}
animIntro();

document.getElementById('enter-btn').addEventListener('click',()=>{
  const intro = document.getElementById('intro');
  intro.classList.add('hide');
  setTimeout(()=>intro.style.display='none', 900);
});

let deferredPrompt;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); deferredPrompt = e;
  document.getElementById('pwa-row').style.display = 'flex';
});
document.getElementById('pwa-btn').addEventListener('click', async () => {
  if(!deferredPrompt) return;
  deferredPrompt.prompt();
  const { outcome } = await deferredPrompt.userChoice;
  if(outcome === 'accepted') document.getElementById('pwa-row').style.display = 'none';
  deferredPrompt = null;
});
window.addEventListener('appinstalled', () => { document.getElementById('pwa-row').style.display = 'none'; });
